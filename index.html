<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Snake — LaunchTower</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #141821;
    --grid: #1a1f2b;
    --snake: #3ddc84;
    --snake-dark: #2ba862;
    --food: #ff5c5c;
    --text: #e8ecf4;
    --dim: #7a8499;
    --accent: #3ddc84;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', ui-monospace, monospace;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px;
  }
  #hud {
    display: flex;
    gap: 24px;
    font-size: 15px;
    letter-spacing: 1px;
    user-select: none;
  }
  #hud .label { color: var(--dim); }
  #hud .val { color: var(--accent); font-weight: bold; }
  #stage {
    position: relative;
    line-height: 0;
  }
  canvas {
    background: var(--grid);
    border: 3px solid #262d3d;
    border-radius: 6px;
    image-rendering: pixelated;
    display: block;
  }
  #startBtn, #pauseBtn {
    margin-top: 6px;
    background: var(--accent);
    color: #0d0f14;
    border: none;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    padding: 12px 34px;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(61,220,132,0.35);
  }
  #pauseBtn {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    box-shadow: none;
    padding: 8px 20px;
    font-size: 13px;
  }
  #startBtn:active, #pauseBtn:active { transform: scale(0.97); }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(13,15,20,0.82);
    border-radius: 6px;
    text-align: center;
    padding: 16px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 26px;
    letter-spacing: 3px;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(61,220,132,0.4);
  }
  #overlay p {
    color: var(--dim);
    font-size: 13px;
    line-height: 1.6;
    max-width: 320px;
  }
  #overlay .big {
    font-size: 18px;
    color: var(--text);
  }
  #overlay .score-line {
    font-size: 15px;
  }
  #overlay .score-line b { color: var(--accent); }

  #hint {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 1px;
    user-select: none;
    text-align: center;
  }
  footer {
    position: fixed;
    bottom: 6px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    z-index: 5;
  }
  footer a {
    color: var(--dim);
    text-decoration: none;
  }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div><span class="label">SCORE </span><span class="val" id="score">0</span></div>
    <div><span class="label">BEST </span><span class="val" id="best">0</span></div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h1>PIXEL SNAKE</h1>
      <p class="big" id="ovTitle">Ready?</p>
      <p class="score-line" id="ovScore"></p>
      <p id="ovHelp">Arrow keys / WASD to steer &nbsp;·&nbsp; swipe on touch.<br>Eat the red food, don't hit yourself or the walls.</p>
      <button id="startBtn">▶ PLAY</button>
      <button id="pauseBtn" style="display:none">PAUSE</button>
    </div>
  </div>
  <div id="hint">SPACE / P = pause &nbsp;·&nbsp; R = restart &nbsp;·&nbsp; swipe on touch</div>
</div>
<footer>
  More free tools &amp; games: <a href="https://pennypenguinapp-beep.github.io/" target="_blank" rel="noopener">LaunchTower</a>
</footer>

<script>
(function () {
  'use strict';

  var GRID = 24;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovScore = document.getElementById('ovScore');
  var ovHelp = document.getElementById('ovHelp');
  var startBtn = document.getElementById('startBtn');

  var CELL = 24; // internal pixel size per cell
  canvas.width = GRID * CELL;
  canvas.height = GRID * CELL;

  // scale canvas to fit the window (letterboxed)
  function fitCanvas() {
    var availW = window.innerWidth - 24;
    var availH = window.innerHeight - 130; // room for hud + footer
    var scale = Math.min(availW / canvas.width, availH / canvas.height, 1.25);
    canvas.style.width = Math.floor(canvas.width * scale) + 'px';
    canvas.style.height = Math.floor(canvas.height * scale) + 'px';
  }
  window.addEventListener('resize', fitCanvas);
  fitCanvas();

  var BEST_KEY = 'launchtower_pixel_snake_best';

  // ---- WebAudio sound cues ----
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type, vol) {
    if (!audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  function soundEat() { beep(660, 0.12, 'square', 0.09); }
  function soundHit() { beep(110, 0.35, 'sawtooth', 0.12); }

  var snake, dir, nextDir, food, score, best, running, paused, gameOver, tickMs, lastTick, growPending;

  best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;
  bestEl.textContent = best;

  function reset() {
    snake = [
      { x: 8, y: 12 },
      { x: 7, y: 12 },
      { x: 6, y: 12 }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    tickMs = 160;
    growPending = 0;
    gameOver = false;
    paused = false;
    placeFood();
    updateHud();
  }

  function placeFood() {
    var free = [];
    var occupied = {};
    for (var i = 0; i < snake.length; i++) {
      occupied[snake[i].x + ',' + snake[i].y] = true;
    }
    for (var x = 0; x < GRID; x++) {
      for (var y = 0; y < GRID; y++) {
        if (!occupied[x + ',' + y]) free.push({ x: x, y: y });
      }
    }
    if (free.length === 0) { food = null; return; }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function step() {
    dir = nextDir;
    var head = snake[0];
    var nx = head.x + dir.x;
    var ny = head.y + dir.y;

    // wall wrap
    if (nx < 0) nx = GRID - 1;
    if (nx >= GRID) nx = 0;
    if (ny < 0) ny = GRID - 1;
    if (ny >= GRID) ny = 0;

    // self collision (tail cell will move unless we grow)
    var willGrow = food && nx === food.x && ny === food.y;
    var checkLen = willGrow ? snake.length : snake.length - 1;
    for (var i = 0; i < checkLen; i++) {
      if (snake[i].x === nx && snake[i].y === ny) {
        endGame();
        return;
      }
    }

    snake.unshift({ x: nx, y: ny });

    if (food && nx === food.x && ny === food.y) {
      score += 10;
      soundEat();
      if (score > best) {
        best = score;
        localStorage.setItem(BEST_KEY, String(best));
      }
      // speed ramp: faster per food, floor at 55ms
      tickMs = Math.max(55, tickMs - 4);
      placeFood();
      if (!food) { winGame(); return; }
    } else {
      snake.pop();
    }
    updateHud();
  }

  function endGame() {
    gameOver = true;
    running = false;
    soundHit();
    var newBest = score >= best && score > 0;
    showOverlay('GAME OVER', 'Score: ' + score + '  ·  Best: ' + best + (newBest ? '  ·  ★ NEW BEST' : ''), 'Press PLAY AGAIN or SPACE to try again');
  }

  function winGame() {
    gameOver = true;
    running = false;
    soundHit();
    showOverlay('YOU FILLED THE GRID!', 'Score: ' + score + '  ·  Best: ' + best, 'Legendary. Press PLAY AGAIN to run it back.');
  }

  function showOverlay(title, scoreLine, help) {
    ovTitle.textContent = title;
    ovScore.textContent = scoreLine;
    ovHelp.innerHTML = help;
    overlay.classList.remove('hidden');
  }

  function startGame() {
    ensureAudio();
    reset();
    overlay.classList.add('hidden');
    running = true;
    lastTick = performance.now();
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (!paused) lastTick = performance.now();
  }

  // ---- rendering ----
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // subtle checkerboard
    for (var x = 0; x < GRID; x++) {
      for (var y = 0; y < GRID; y++) {
        if ((x + y) % 2 === 0) {
          ctx.fillStyle = 'rgba(255,255,255,0.015)';
          ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        }
      }
    }

    // food (pulsing)
    if (food) {
      var pulse = 0.75 + 0.25 * Math.sin(performance.now() / 180);
      var fx = food.x * CELL, fy = food.y * CELL;
      var inset = Math.floor(CELL * 0.18 * (2 - pulse));
      ctx.fillStyle = '#ff5c5c';
      ctx.fillRect(fx + inset, fy + inset, CELL - inset * 2, CELL - inset * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillRect(fx + CELL * 0.3, fy + CELL * 0.25, Math.floor(CELL * 0.15), Math.floor(CELL * 0.15));
    }

    // snake
    for (var i = snake.length - 1; i >= 0; i--) {
      var s = snake[i];
      var isHead = i === 0;
      var px = s.x * CELL, py = s.y * CELL;
      var pad = isHead ? 1 : 2;
      ctx.fillStyle = isHead ? '#5cffa4' : (i % 2 === 0 ? '#3ddc84' : '#2ba862');
      ctx.fillRect(px + pad, py + pad, CELL - pad * 2, CELL - pad * 2);
      if (isHead) {
        // eyes
        ctx.fillStyle = '#0d0f14';
        var ex = dir.x === 0 ? 4 : (dir.x > 0 ? CELL - 8 : 4);
        var ey = dir.y === 0 ? 4 : (dir.y > 0 ? CELL - 8 : 4);
        ctx.fillRect(px + ex, py + ey, 4, 4);
        ctx.fillRect(px + (CELL - 4 - ex), py + ey, 4, 4);
      }
    }

    if (paused) {
      ctx.fillStyle = 'rgba(13,15,20,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#e8ecf4';
      ctx.font = 'bold 28px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
      ctx.textAlign = 'left';
    }
  }

  function loop(now) {
    if (running && !paused) {
      if (now - lastTick >= tickMs) {
        lastTick = now;
        step();
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ---- input ----
  var DIRS = {
    ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
    w: { x: 0, y: -1 }, s: { x: 0, y: 1 },
    a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
    W: { x: 0, y: -1 }, S: { x: 0, y: 1 },
    A: { x: -1, y: 0 }, D: { x: 1, y: 0 }
  };

  function setDir(d) {
    // no 180° reversal
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === ' ' || k === 'Spacebar' || k === 'p' || k === 'P' || k === 'Escape') {
      e.preventDefault();
      if (overlayVisible()) startGame();
      else togglePause();
      return;
    }
    if (k === 'r' || k === 'R') {
      startGame();
      return;
    }
    var d = DIRS[k];
    if (d) {
      e.preventDefault();
      if (overlayVisible()) startGame();
      setDir(d);
    }
  });

  // auto-pause when tab hidden
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && running && !paused) togglePause();
  });

  function overlayVisible() {
    return !overlay.classList.contains('hidden');
  }

  var pauseBtn = document.getElementById('pauseBtn');
  startBtn.addEventListener('click', function () {
    startGame();
    startBtn.blur();
  });
  pauseBtn.addEventListener('click', function () {
    togglePause();
    pauseBtn.blur();
  });

  // swipe controls (works on the whole stage so it's easy to hit)
  var touchStart = null;
  var stage = document.getElementById('stage');
  stage.addEventListener('touchstart', function (e) {
    if (e.touches.length === 1) {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
    }
  }, { passive: true });

  stage.addEventListener('touchmove', function (e) {
    if (!touchStart) return;
    e.preventDefault();
    var dx = e.touches[0].clientX - touchStart.x;
    var dy = e.touches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir({ x: dx > 0 ? 1 : -1, y: 0 });
    } else {
      setDir({ x: 0, y: dy > 0 ? 1 : -1 });
    }
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
  }, { passive: false });

  stage.addEventListener('touchend', function (e) {
    if (touchStart && Date.now() - touchStart.t < 250) {
      // quick tap = start when overlay is up
      if (overlayVisible()) startGame();
    }
    touchStart = null;
  }, { passive: true });

  // mouse tap to start when overlay is up
  canvas.addEventListener('click', function () {
    if (overlayVisible()) startGame();
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
